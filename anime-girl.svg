<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" role="img" aria-label="Cute anime girl coding on a laptop" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1540"/>
      <stop offset="1" stop-color="#0b1a3a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a587ff"/>
      <stop offset="1" stop-color="#7a58e8"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#9cf3ff"/>
      <stop offset="1" stop-color="#3a7bff"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ee7ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5ee7ff" stop-opacity="0"/>
    </radialGradient>
    <path id="heart" d="M0 0 C-6 -9 -19 -3 0 13 C19 -3 6 -9 0 0Z"/>
    <path id="spark" d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z"/>
  </defs>

  <style>
    .float { animation: float 4s ease-in-out infinite; }
    .sway  { animation: sway 5s ease-in-out infinite; transform-origin: 200px 150px; }
    .blink { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
    .tw    { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .rise  { animation: rise 5s ease-in infinite; opacity: 0; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ear   { animation: ear 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    .bubble{ animation: bubble 6s ease-in-out infinite; }
    .type  { font: 700 13px 'Courier New', monospace; fill: #ff7eb6; }

    @keyframes float   { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
    @keyframes sway    { 0%,100% { transform: rotate(-1.6deg) } 50% { transform: rotate(1.6deg) } }
    @keyframes blink   { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(0.08) } }
    @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.6) } 50% { opacity: 1; transform: scale(1.1) } }
    @keyframes rise    { 0% { opacity: 0; transform: translateY(0) scale(.6) } 15% { opacity: .95 } 100% { opacity: 0; transform: translateY(-120px) scale(1.1) } }
    @keyframes pulse   { 0%,100% { opacity: .55; transform: scale(.9) } 50% { opacity: 1; transform: scale(1.15) } }
    @keyframes ear     { 0%,85%,100% { transform: rotate(0) } 90% { transform: rotate(-9deg) } 95% { transform: rotate(5deg) } }
    @keyframes bubble  { 0%,8% { opacity: 0 } 18%,70% { opacity: 1 } 82%,100% { opacity: 0 } }
  </style>

  <!-- background -->
  <rect width="400" height="440" rx="24" fill="url(#bg)"/>
  <circle cx="330" cy="70" r="34" fill="#ffe9a8" opacity=".92"/>
  <circle cx="342" cy="62" r="30" fill="#1b1540"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle class="tw" cx="40"  cy="50"  r="2"   style="animation-delay:0s"/>
    <circle class="tw" cx="95"  cy="95"  r="1.6" style="animation-delay:.6s"/>
    <circle class="tw" cx="60"  cy="170" r="1.8" style="animation-delay:1.2s"/>
    <circle class="tw" cx="360" cy="190" r="2"   style="animation-delay:.3s"/>
    <circle class="tw" cx="30"  cy="290" r="1.6" style="animation-delay:1.7s"/>
    <circle class="tw" cx="372" cy="300" r="1.8" style="animation-delay:.9s"/>
    <circle class="tw" cx="150" cy="40"  r="1.5" style="animation-delay:2s"/>
  </g>
  <g fill="#ffd6ec">
    <use href="#spark" class="tw" x="70"  y="120" style="animation-delay:.2s"/>
    <use href="#spark" class="tw" x="335" y="140" style="animation-delay:1s"/>
    <use href="#spark" class="tw" x="55"  y="235" style="animation-delay:1.6s"/>
    <use href="#spark" class="tw" x="350" y="250" style="animation-delay:.5s"/>
  </g>

  <!-- floating hearts -->
  <g fill="#ff7eb6">
    <g transform="translate(95 330)"><use href="#heart" class="rise" style="animation-delay:0s"/></g>
    <g transform="translate(310 340)"><use href="#heart" class="rise" style="animation-delay:1.7s"/></g>
    <g transform="translate(60 300)"><use href="#heart" class="rise" style="animation-delay:3.2s"/></g>
    <g transform="translate(345 310)"><use href="#heart" class="rise" style="animation-delay:4.1s"/></g>
  </g>

  <!-- girl -->
  <g class="float">

    <!-- back hair (sways) -->
    <g class="sway">
      <path d="M102 190 C84 260 92 330 120 352 L150 300 L150 190 Z" fill="#6a4bd1"/>
      <path d="M298 190 C316 260 308 330 280 352 L250 300 L250 190 Z" fill="#6a4bd1"/>
      <ellipse cx="200" cy="190" rx="100" ry="98" fill="url(#hair)"/>
    </g>

    <!-- body: hoodie -->
    <path d="M128 345 Q128 282 200 272 Q272 282 272 345 L272 412 L128 412 Z" fill="#ff7eb6"/>
    <path d="M178 276 Q200 300 222 276 L214 270 Q200 284 186 270 Z" fill="#e8629f"/>
    <circle cx="190" cy="300" r="3" fill="#fff" opacity=".85"/>
    <circle cx="210" cy="300" r="3" fill="#fff" opacity=".85"/>
    <rect x="187" y="252" width="26" height="26" rx="8" fill="#ffe3d3"/>

    <!-- laptop (back view) -->
    <rect x="144" y="334" width="112" height="70" rx="7" fill="#262c4d" stroke="#5ee7ff" stroke-width="2"/>
    <circle class="pulse" cx="200" cy="369" r="18" fill="url(#glow)"/>
    <path d="M200 380 C186 368 190 358 200 363 C210 358 214 368 200 380Z" fill="#ff7eb6"/>
    <!-- hands -->
    <circle cx="150" cy="340" r="9" fill="#ffe3d3"/>
    <circle cx="250" cy="340" r="9" fill="#ffe3d3"/>

    <!-- face -->
    <ellipse cx="200" cy="192" rx="80" ry="72" fill="#ffe3d3"/>

    <!-- cat ears -->
    <g class="ear">
      <polygon points="126,138 132,76 178,114" fill="#8f6bff"/>
      <polygon points="138,128 141,96 163,116" fill="#ffb3d6"/>
    </g>
    <g class="ear" style="animation-delay:.25s">
      <polygon points="274,138 268,76 222,114" fill="#8f6bff"/>
      <polygon points="262,128 259,96 237,116" fill="#ffb3d6"/>
    </g>

    <!-- eyes -->
    <g class="blink">
      <ellipse cx="163" cy="200" rx="17" ry="23" fill="#2b1a4f"/>
      <ellipse cx="163" cy="205" rx="13" ry="18" fill="url(#iris)"/>
      <circle cx="157" cy="195" r="6" fill="#fff"/>
      <circle cx="170" cy="212" r="3" fill="#fff" opacity=".9"/>
      <ellipse cx="237" cy="200" rx="17" ry="23" fill="#2b1a4f"/>
      <ellipse cx="237" cy="205" rx="13" ry="18" fill="url(#iris)"/>
      <circle cx="231" cy="195" r="6" fill="#fff"/>
      <circle cx="244" cy="212" r="3" fill="#fff" opacity=".9"/>
    </g>

    <!-- blush + mouth -->
    <ellipse cx="136" cy="228" rx="14" ry="7" fill="#ff9ec4" opacity=".7"/>
    <ellipse cx="264" cy="228" rx="14" ry="7" fill="#ff9ec4" opacity=".7"/>
    <path d="M188 232 Q200 246 212 232" fill="none" stroke="#c2506f" stroke-width="3" stroke-linecap="round"/>
    <path d="M194 234 Q200 242 206 234 Z" fill="#ff8aa8"/>

    <!-- bangs (sway) -->
    <g class="sway">
      <path d="M116 190 C108 96 292 96 284 190 Q270 150 246 160 Q226 134 200 164 Q174 134 154 160 Q130 150 116 190 Z" fill="url(#hair)"/>
      <path d="M200 164 Q196 140 186 122" fill="none" stroke="#c9b6ff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
      <path d="M175 108 Q200 100 225 108" fill="none" stroke="#c9b6ff" stroke-width="4" stroke-linecap="round" opacity=".55"/>
    </g>

    <!-- hair clip -->
    <g transform="translate(258 132)">
      <use href="#spark" fill="#ffe9a8" class="pulse"/>
    </g>
  </g>

  <!-- speech bubble -->
  <g class="bubble">
    <rect x="232" y="30" width="136" height="38" rx="14" fill="#fff"/>
    <path d="M250 68 L246 84 L266 68 Z" fill="#fff"/>
    <text class="type" x="300" y="54" text-anchor="middle">hello, world!</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
