
name: Animated Language Graph

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate animated language graph
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/languages.svg
          colors: dark-dimmed
          custom-title: My Programming Languages
          hide-keys: general, contributions, repositories
          max-languages: 8
          animated-language-chart: true
          language-animation-speed: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
